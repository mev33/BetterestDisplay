name: Crisp
options:
  bundleIdPrefix: local.betterestdisplay
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - Base

targets:
  Crisp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Crisp
        excludes:
          - "**/*.md"
    settings:
      base:
        # BetterestDisplay: distinct from upstream Crisp (com.crisp.app), so this fork
        # has its own settings, Accessibility grant and login item, and never
        # overwrites an upstream install. scripts/build-app.sh and dev.sh read it here.
        PRODUCT_BUNDLE_IDENTIFIER: local.betterestdisplay.app
        # The app is BetterestDisplay.app with a BetterestDisplay executable. The Swift
        # module keeps upstream's name, so code and tests stay as upstream wrote them.
        PRODUCT_NAME: BetterestDisplay
        PRODUCT_MODULE_NAME: Crisp
        INFOPLIST_KEY_CFBundleDisplayName: BetterestDisplay
        # Without an explicit MARKETING_VERSION the generated Info.plist omits
        # CFBundleShortVersionString and the app self-reports 1.0.0 forever.
        MARKETING_VERSION: "1.7.1"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "BetterestDisplay - an offline fork of Crisp, free & open source"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "BetterestDisplay uses System Events to switch Dark Mode with the system's animated transition."
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Crisp/Crisp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        # "Sign to Run Locally": an Xcode build needs no Apple ID (that would sign
        # in to Apple over the network). The everyday build, make app / make dev,
        # signs with the stable self-signed "BetterestDisplay Dev" identity (docs/BUILDING.md).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OBJC_BRIDGING_HEADER: Crisp/Crisp-Bridging-Header.h
        # SLSConfigureDisplayEnabled / SLSGetDisplayList live in the private
        # SkyLight.framework (physical display disconnect). SkyLight is already
        # loaded in-process via AppKit, so mark just these two symbols as
        # resolved-at-runtime instead of hard-linking a private framework path.
        OTHER_LDFLAGS: "-Wl,-U,_SLSConfigureDisplayEnabled -Wl,-U,_SLSGetDisplayList -Wl,-U,_SLSSetDisplayRotation"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  bdctl:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/bdctl
      - path: Crisp/Models/CrispControlModel.swift
      - path: Crisp/Models/BrightnessKeySteps.swift
    settings:
      base:
        PRODUCT_NAME: bdctl
        SWIFT_VERSION: "6.0"
  CrispTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CrispTests
      - path: Crisp/Models/DisplayColorMode.swift
      - path: Crisp/Models/DisplayModeGeometry.swift
      - path: Crisp/Models/DisplayModeCommitScope.swift
      - path: Crisp/Models/DDCServiceMatcher.swift
      - path: Crisp/Models/DDCOperationQueuePool.swift
      - path: Crisp/Models/DisplayConnectionQueue.swift
      - path: Crisp/Models/DDCOperationGeneration.swift
      - path: Crisp/Models/DDCTopologyChange.swift
      - path: Crisp/Models/RefreshRateFormat.swift
      - path: Crisp/Models/GammaPersistenceKey.swift
      - path: Crisp/Models/HiDPIOverrideCommand.swift
      - path: Crisp/Models/VariableRefreshModes.swift
      - path: Crisp/Models/KeyboardShortcut.swift
      - path: Crisp/Models/CombinedBrightnessMath.swift
      - path: Crisp/Models/DisplayPreset.swift
      - path: Crisp/Models/GammaAdjustment.swift
      - path: Crisp/Models/CrispControlModel.swift
      - path: Crisp/Models/BrightnessKeySteps.swift
      - path: Crisp/Models/ScreenCount.swift
      - path: Crisp/Models/DDCVolumeMax.swift
      - path: Crisp/Models/VolumeKeyRouting.swift
      - path: Crisp/Models/EdgeCrossing.swift
      - path: Crisp/Models/DDCInputSource.swift
      - path: Crisp/Models/DisplayRotation.swift
      - path: Crisp/Models/ArrangementSnap.swift
      - path: Crisp/Models/DebugReport.swift
      - path: Crisp/Models/KeepAwakeDuration.swift
      - path: Crisp/Models/PrivilegedOperation.swift
      - path: Crisp/Models/SystemFileRecord.swift
      - path: Crisp/Models/DDCWritePolicy.swift
      - path: Crisp/Models/DDCWriteBudget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.betterestdisplay.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  Crisp:
    build:
      targets:
        Crisp: all
        bdctl: all
    test:
      targets:
        - CrispTests
  bdctl:
    build:
      targets:
        bdctl: all
